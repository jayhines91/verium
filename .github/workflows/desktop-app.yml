name: Build Vericonomy Wallet (Tauri)

on:
  push:
    branches:
      [
        main,
        master,
        testnet,
        tippy-gui-changes-modern-template,
        tippy-binary-chain-implementation,
      ]
    tags:
      - "desktop-v*"
    paths:
      - "desktop/verium-app/**"
      - ".github/workflows/desktop-app.yml"
  pull_request:
    paths:
      - "desktop/verium-app/**"
      - ".github/workflows/desktop-app.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create / update a GitHub Release with the bundle artifacts"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: verium-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the rebranded veriumd daemon from source so the bundled sidecar
  # advertises /Vericonomy:1.0.0(alpha1)/ on the network instead of the stock
  # CDN /Verium:1.3.5.2/ binary. Reuses the proven per-platform recipes
  # (native Linux/macOS via depends; Windows cross-compiled with MinGW).
  veriumd:
    name: veriumd sidecar (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            host: x86_64-linux-gnu
            kind: linux
            configure_extra: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            host: aarch64-linux-gnu
            kind: linux
            configure_extra: "--enable-arm-crypto"
          - target: x86_64-apple-darwin
            os: macos-13
            host: x86_64-apple-darwin
            kind: macos
            configure_extra: ""
          - target: aarch64-apple-darwin
            os: macos-14
            host: aarch64-apple-darwin
            kind: macos
            configure_extra: "--enable-arm-crypto"
          - target: x86_64-pc-windows-msvc
            os: ubuntu-22.04
            host: x86_64-w64-mingw32
            kind: mingw
            configure_extra: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Linux / MinGW build dependencies
        if: matrix.kind == 'linux' || matrix.kind == 'mingw'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 curl ca-certificates

      - name: MinGW cross toolchain
        if: matrix.kind == 'mingw'
        run: |
          sudo apt-get install -y g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix || true
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix || true

      - name: macOS build dependencies
        if: matrix.kind == 'macos'
        run: |
          brew update
          brew install automake libtool pkg-config

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: depends-${{ matrix.host }}-${{ hashFiles('depends/packages/*.mk') }}
          restore-keys: depends-${{ matrix.host }}-

      - name: MinGW source shim (gmtime_r)
        if: matrix.kind == 'mingw'
        run: |
          f=src/util/time.cpp
          if [ -f "$f" ] && ! grep -q 'gmtime_r_compat' "$f"; then
            {
              echo '#ifdef _WIN32'
              echo '#include <time.h>'
              echo 'static inline struct tm* gmtime_r_compat(const time_t* t, struct tm* res){ return gmtime_s(res,t)==0 ? res : NULL; }'
              echo '#define gmtime_r(t,r) gmtime_r_compat((t),(r))'
              echo '#endif'
              cat "$f"
            } > "$f".tmp && mv "$f".tmp "$f"
          fi

      - name: Build depends
        shell: bash
        run: |
          set -e
          JOBS=$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu || echo 2)
          EXTRA=""
          if [ "${{ matrix.kind }}" = "mingw" ]; then
            EXTRA="RC=${{ matrix.host }}-windres WINDRES=${{ matrix.host }}-windres CC_FOR_BUILD=gcc CXX_FOR_BUILD=g++"
          fi
          make -C depends HOST=${{ matrix.host }} -j"$JOBS" $EXTRA

      - name: Configure + build veriumd
        shell: bash
        run: |
          set -e
          JOBS=$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu || echo 2)
          ./autogen.sh
          export CONFIG_SITE="$(pwd)/depends/${{ matrix.host }}/share/config.site"
          MINGW_FLAGS=""
          if [ "${{ matrix.kind }}" = "mingw" ]; then
            MINGW_FLAGS="ac_cv_search_clock_gettime=no"
          fi
          if [ "${{ matrix.kind }}" = "macos" ]; then
            case "${{ matrix.host }}" in
              aarch64-*) export MACOSX_DEPLOYMENT_TARGET=11.0 ;;
              *)         export MACOSX_DEPLOYMENT_TARGET=10.15 ;;
            esac
          fi
          ./configure \
            --host=${{ matrix.host }} \
            --prefix="$(pwd)/depends/${{ matrix.host }}" \
            --without-gui --disable-tests --disable-bench \
            --enable-reduce-exports --disable-shared --enable-static \
            ${{ matrix.configure_extra }} $MINGW_FLAGS \
          || { echo "=== config.log (tail) ==="; tail -n 150 config.log || true; exit 1; }
          make -j"$JOBS" src/veriumd

      - name: Smoke test (print version / subversion)
        if: matrix.kind != 'mingw'
        shell: bash
        run: ./src/veriumd -version | head -n 3

      - name: Stage sidecar binary
        shell: bash
        run: |
          set -e
          mkdir -p out
          if [ "${{ matrix.kind }}" = "mingw" ]; then
            cp src/veriumd.exe "out/veriumd-${{ matrix.target }}.exe"
          else
            cp src/veriumd "out/veriumd-${{ matrix.target }}"
            chmod +x "out/veriumd-${{ matrix.target }}"
          fi
          ls -la out

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: veriumd-sidecar-${{ matrix.target }}
          path: out/veriumd-${{ matrix.target }}*
          if-no-files-found: error

  build:
    name: ${{ matrix.os }} (${{ matrix.target }})
    needs: veriumd
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: desktop/verium-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/verium-app/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('desktop/verium-app/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libfuse2

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Type check
        run: npm run lint

      - name: Frontend unit tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Download rebranded veriumd sidecar
        uses: actions/download-artifact@v4
        with:
          name: veriumd-sidecar-${{ matrix.target }}
          path: desktop/verium-app/src-tauri/binaries

      - name: Mark veriumd sidecar executable
        if: runner.os != 'Windows'
        run: chmod +x src-tauri/binaries/veriumd-${{ matrix.target }} || true

      - name: Fetch bundled veriumd sidecar (fallback if artifact missing)
        env:
          VERIUMD_TARGET_TRIPLE: ${{ matrix.target }}
          VERIUMD_OPTIONAL: ${{ contains(github.ref, 'refs/tags/desktop-v') && '0' || '1' }}
          # Keep the rebranded from-source binary downloaded above; only hit the
          # CDN if the build artifact is somehow absent.
          VERIUMD_SKIP_IF_PRESENT: "1"
        run: npm run fetch:veriumd

      - name: Fetch bundled vericoind sidecar
        env:
          VERICOIND_TARGET_TRIPLE: ${{ matrix.target }}
          VERICOIND_REQUIRED: ${{ contains(github.ref, 'refs/tags/desktop-v') && '1' || '0' }}
        run: npm run fetch:vericoind

      - name: Cargo check (Tauri backend)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Backend unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Tauri bundle
        run: npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Stage bundle artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION="$(node -p "require('./package.json').version")"
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)    PLATFORM="Windows_x64" ;;
            x86_64-apple-darwin)       PLATFORM="macOS_Intel" ;;
            aarch64-apple-darwin)      PLATFORM="macOS_AppleSilicon" ;;
            x86_64-unknown-linux-gnu)  PLATFORM="Linux_x64" ;;
            aarch64-unknown-linux-gnu) PLATFORM="Linux_ARM64" ;;
            *)                         PLATFORM="${{ matrix.target }}" ;;
          esac
          # Canonical asset name: Vericonomy_Wallet_<version>_<platform>.<ext>
          # (e.g. Vericonomy_Wallet_1.0.0-alpha.1_Windows_x64.exe)
          BASENAME="Vericonomy_Wallet_${VERSION}_${PLATFORM}"
          while IFS= read -r -d '' f; do
            case "$f" in
              *.app.tar.gz) ext="app.tar.gz" ;;
              *.tar.gz)     ext="tar.gz" ;;
              *)            ext="${f##*.}" ;;
            esac
            cp "$f" "artifacts/${BASENAME}.${ext}"
          done < <(find src-tauri/target/${{ matrix.target }}/release/bundle -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.AppImage" \
               -o -name "*.deb" -o -name "*.msi" -o -name "*.exe" \) -print0)
          ls -la artifacts/ || true

      - name: Generate release hashes manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, glob, os, datetime
          os.chdir("artifacts")
          files = glob.glob("*")
          hashes = {"generated_at": datetime.datetime.utcnow().isoformat() + "Z"}
          for f in files:
              if f.endswith(".exe") or f.endswith(".msi"):
                  with open(f, "rb") as fh:
                      h = hashlib.sha256(fh.read()).hexdigest()
                  if "setup" in f.lower() or f.endswith(".exe"):
                      hashes["app"] = h
          sidecar = f"../src-tauri/binaries/veriumd-${{ matrix.target }}"
          if [ -f "$sidecar" ] || [ -f "${sidecar}.exe" ]; then
              true
          fi
          PY
          # Hash sidecar if present
          if [ "${{ runner.os }}" = "Windows" ]; then
            SC="src-tauri/binaries/veriumd-${{ matrix.target }}.exe"
          else
            SC="src-tauri/binaries/veriumd-${{ matrix.target }}"
          fi
          if [ -f "$SC" ]; then
            SIDE_HASH=$(sha256sum "$SC" | awk '{print $1}')
            python3 -c "import json; d=json.load(open('release-hashes.json')); d['veriumd']='$SIDE_HASH'; json.dump(d, open('release-hashes.json','w'), indent=2)"
          fi
          cp release-hashes.json artifacts/ 2>/dev/null || cp ../release-hashes.json artifacts/ || true

      - name: Install cosign (optional signing)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign release artifacts with cosign
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          for f in artifacts/*; do
            cosign sign-blob --yes "$f" --output-signature "${f}.sig" || true
          done
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vericonomy-desktop-${{ matrix.target }}
          path: desktop/verium-app/artifacts/**
          if-no-files-found: warn

      - name: Sidecar smoke test (veriumd --version)
        if: hashFiles('desktop/verium-app/src-tauri/binaries/veriumd-*') != ''
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="src-tauri/binaries/veriumd-${{ matrix.target }}.exe"
          else
            bin="src-tauri/binaries/veriumd-${{ matrix.target }}"
          fi
          if [ ! -x "$bin" ]; then
            echo "Sidecar not executable, skipping: $bin"
            exit 0
          fi
          "$bin" -? || true
          "$bin" --version || true

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vericonomy-desktop-*
          merge-multiple: true
          path: release-assets

      - name: List release assets
        run: ls -la release-assets || true

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          changelog="desktop/verium-app/CHANGELOG.md"
          if [ -f "$changelog" ]; then
            awk -v v="$version" '
              $0 ~ "^## \\[?"v"\\]?" { capture=1; next }
              capture && $0 ~ /^## / { exit }
              capture { print }
            ' "$changelog" > release_notes.md
            if [ ! -s release_notes.md ]; then
              cp "$changelog" release_notes.md
            fi
          else
            echo "Vericonomy Wallet $version" > release_notes.md
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Vericonomy Wallet ${{ steps.notes.outputs.version }}
          body_path: release_notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/**
