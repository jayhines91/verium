name: Build Verium desktop app (Tauri)

on:
  push:
    branches: [main, master, testnet, tippy-gui-changes-modern-template]
    tags:
      - "desktop-v*"
    paths:
      - "desktop/verium-app/**"
      - ".github/workflows/desktop-app.yml"
  pull_request:
    paths:
      - "desktop/verium-app/**"
      - ".github/workflows/desktop-app.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create / update a GitHub Release with the bundle artifacts"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: verium-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          # Apple Silicon: use the Intel .dmg via Rosetta until arm64 veriumd is on CDN.
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: desktop/verium-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/verium-app/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('desktop/verium-app/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libfuse2

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Type check
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Fetch bundled veriumd sidecar
        env:
          VERIUMD_TARGET_TRIPLE: ${{ matrix.target }}
          VERIUMD_OPTIONAL: ${{ contains(github.ref, 'refs/tags/desktop-v') && '0' || '1' }}
        run: npm run fetch:veriumd

      - name: Cargo check (Tauri backend)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Tauri bundle
        run: npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Stage bundle artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.AppImage" \
               -o -name "*.deb" -o -name "*.msi" -o -name "*.exe" \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verium-desktop-${{ matrix.target }}
          path: desktop/verium-app/artifacts/**
          if-no-files-found: warn

      - name: Sidecar smoke test (veriumd --version)
        if: hashFiles('desktop/verium-app/src-tauri/binaries/veriumd-*') != ''
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="src-tauri/binaries/veriumd-${{ matrix.target }}.exe"
          else
            bin="src-tauri/binaries/veriumd-${{ matrix.target }}"
          fi
          if [ ! -x "$bin" ]; then
            echo "Sidecar not executable, skipping: $bin"
            exit 0
          fi
          "$bin" -? || true
          "$bin" --version || true

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: verium-desktop-*
          merge-multiple: true
          path: release-assets

      - name: List release assets
        run: ls -la release-assets || true

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          changelog="desktop/verium-app/CHANGELOG.md"
          if [ -f "$changelog" ]; then
            awk -v v="$version" '
              $0 ~ "^## \\[?"v"\\]?" { capture=1; next }
              capture && $0 ~ /^## / { exit }
              capture { print }
            ' "$changelog" > release_notes.md
            if [ ! -s release_notes.md ]; then
              cp "$changelog" release_notes.md
            fi
          else
            echo "Vericonomy Wallet $version" > release_notes.md
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Vericonomy Wallet ${{ steps.notes.outputs.version }}
          body_path: release_notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/**
